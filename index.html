<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Super Torch+++ Premium</title>
    <link rel="icon" href="./icons/favicon.ico" type="image/x-icon">
    <link rel="manifest" href="./icons/site.webmanifest">
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
    <style>
        * {
            box-sizing: border-box;
        } 

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
            touch-action: none;
            background: black;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            font-family: sans-serif;
        }

        #helpButton {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: white;
            padding: 5px;
            background: #666;
            border-radius: 4px;
            border: solid 1px #888;
            cursor: pointer;
        }
 
        #premiumModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            background: rgba(0, 0, 0, 0.65);
            z-index: 1000;
            box-sizing: border-box;
        }
 
        #modalContent {
            position: absolute;
            left: 0;
            bottom: 0;

            width: 100%;
            height: 70%;
            height: 70dvh;

            box-sizing: border-box;

            background: #181818;
            border-radius: 22px 22px 0 0;

            padding: 30px 20px;
            padding-bottom: calc(20px + env(safe-area-inset-bottom));

            color: white;

            display: flex;
            flex-direction: column;
            align-items: center;

            overflow-y: auto;
            overflow-x: hidden;
        }

        #closeModal {
            position: absolute;
            top: 15px;
            right: 20px;
            background: none;
            border: none;
            color: #aaa;
            font-size: 30px;
            cursor: pointer;
        }

        #modalContent h2 {
            font-size: 27px;
            margin: 25px 0 8px;
            text-align: center;
        }

        #modalSubtitle {
            color: #aaa;
            text-align: center;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .plan {
            width: 100%;
            max-width: 450px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 17px;
            margin-bottom: 12px;
            border: 2px solid #444;
            border-radius: 10px;
            background: #252525;
            cursor: pointer;
        }

        .plan.selected {
            border-color: #35c96b;
            background: #203528;
        }

        .planName {
            font-size: 17px;
            font-weight: bold;
        }

        .planPrice {
            font-size: 15px;
            color: #ccc;
        }

        .plan input {
            accent-color: #35c96b;
            width: 19px;
            height: 19px;
        }
 
        #subscribeButton {
            width: 100%;
            max-width: 450px;
            padding: 16px;
            margin-top: auto;
            background: #24b957;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        #subscribeButton:active {
            background: #199947;
        }

        #disclaimer {
            color: #777;
            font-size: 11px;
            text-align: center;
            margin-top: 12px;
        }
    </style>
  </head>
  <body>
      <img src="./torch image.png"
         style="width: 130vw; height: auto; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);">

    <button id="helpButton">Help?</button>

    <div id="premiumModal">

        <div id="modalContent">

            <button id="closeModal" aria-label="Close">&times;</button>

            <h2>Unlock Premium</h2>

            <p id="modalSubtitle">
                Get the ultimate Super Torch+++ experience.
            </p>

            <label class="plan selected">
                <div>
                    <div class="planName">Yearly</div>
                    <div class="planPrice">$79.99 / year</div>
                </div>
                <input type="radio" name="plan" value="yearly" checked>
            </label>

            <label class="plan">
                <div>
                    <div class="planName">Monthly</div>
                    <div class="planPrice">$9.99 / month</div>
                </div>
                <input type="radio" name="plan" value="monthly">
            </label>

            <label class="plan">
                <div>
                    <div class="planName">Daily</div>
                    <div class="planPrice">$0.99 / day</div>
                </div>
                <input type="radio" name="plan" value="daily">
            </label>

            <button id="subscribeButton">Subscribe</button>

            <p id="disclaimer">Subscriptions are non refundable. <br> $4.99 cancelation fee.</p>

        </div>
    </div>

    <script>
        const helpButton = document.getElementById("helpButton");
        const premiumModal = document.getElementById("premiumModal");
        const closeModal = document.getElementById("closeModal");

        helpButton.addEventListener("click", () => {
            premiumModal.style.display = "block";
        });

        closeModal.addEventListener("click", () => {
            premiumModal.style.display = "none";
        });
 
        premiumModal.addEventListener("click", (event) => {
            if (event.target === premiumModal) {
                premiumModal.style.display = "none";
            }
        });
        const plans = document.querySelectorAll(".plan");

        plans.forEach(plan => {
            plan.addEventListener("click", () => {
                plans.forEach(p => p.classList.remove("selected"));
                plan.classList.add("selected");
                plan.querySelector("input").checked = true;
            });
        });
    </script>
        <!-- <img src="./torch image.png" style="width: 130vw; heigh: auto; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);"> -->
      <!-- <button style="position: absolute; bottom: 20px; right: 20px; color: white; padding: 5px; background: #666; border-radius: 4px; border: solid 1px #888;">Help?</button> -->
  </body>
</html>
